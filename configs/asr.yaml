    license: {id: MIT, url: https://github.com/openai/whisper/blob/main/LICENSE, commercial_use: "yes", notes: "HF metadata says apache-2.0, GitHub says MIT for code+weights; both permissive."}
    verified: "2026-09-23"
    sources: [https://huggingface.co/openai/whisper-tiny, https://github.com/openai/whisper]
    notes: "Only a pipeline smoke-test baseline for Nepali."

