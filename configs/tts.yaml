  - id: indic-parler-tts
    name: AI4Bharat Indic Parler-TTS
    provider: parler
    enabled: false   # needs its own venv (parler-tts pins transformers==4.46.1) - see docs/tts.md
    checkpoint: ai4bharat/indic-parler-tts
    revision: 7b527af5ee8ed1f9a28d80b19703ed9bb8ba10ca
    languages: [ne, hi, mai, en, "17 more"]
    params:
      voice: Amrita
      description: "{voice} speaks with a moderate pace in a clear voice. The recording is of very high quality with no background noise."
    size: 0.94B params, ~3.76 GB, 44.1 kHz
    hardware: "CUDA GPU recommended; CPU very slow"
    license: {id: Apache-2.0, url: https://huggingface.co/ai4bharat/indic-parler-tts, commercial_use: "yes", notes: "Card Apache-2.0; training data includes IndicTTS/LIMMITS/Rasa (CC BY 4.0) - attribute. Gated (auto): accept terms + HF_TOKEN."}
    verified: "2026-09-23"
    sources: [https://huggingface.co/ai4bharat/indic-parler-tts, https://github.com/huggingface/parler-tts]
    notes: "Only documented Nepali speaker: 'Amrita' (female). Streaming supported per card."

  - id: xtts-ne-oshara-e10
    name: Oshara XTTS-v2 Nepali fine-tune (epoch 10, recommended by the card)
    provider: xtts
    enabled: false   # non-commercial licence + RTF ~3.7 on this CPU: opt-in only
    checkpoint: Oshara/xtts-v2-nepali
    revision: 1ef72e4a13e201409a895ef45c36b38adbe324d8
    languages: [ne]
    params:
      subfolder: epoch-10
      language: hi          # see notes: [hi] token, measured better than the card's "ne" route
      voice: Claribel Dervla   # one of 58 built-in XTTS speakers; or pass a reference WAV to clone
      options: {temperature: 0.65, repetition_penalty: 5.0}   # values from the model card
    size: ~0.47B params, 1.88 GB (epoch-10/ folder), 24 kHz, zero-shot voice cloning
    hardware: "Separate env (make install-xtts). CPU works but slow (RTF ~3.7, load ~32 s on i5-7400); GPU recommended"
    license:
      id: Coqui Public Model License 1.0.0 (inherited from coqui/XTTS-v2, per the fine-tune's own card)
      url: https://huggingface.co/coqui/XTTS-v2/blob/main/LICENSE.txt
      commercial_use: "no"
      notes: "CPML 'allows only non-commercial use of a machine learning model and its outputs'. Explicitly allowed: 'Use by commercial or for-profit entities for testing, evaluation, or non-commercial research and development' (so benchmarking here is fine). Not allowed: production/revenue use, or using outputs to train models for commercial use. Coqui shut down in 2024, so no commercial licence can be obtained. Fine-tune data ('4,140 single-speaker Nepali clips') source not stated - REVIEW REQUIRED. Runtime coqui-tts is MPL-2.0."
    verified: "2026-09-24"
    sources: [https://huggingface.co/Oshara/xtts-v2-nepali, https://huggingface.co/coqui/XTTS-v2/blob/main/LICENSE.txt, https://github.com/idiap/coqui-ai-TTS]
    notes: "The card's language='ne' route speaks a literal 'ने' before every sentence with stock coqui-tts 0.27.5 (vocab has no [ne] token); the [hi] token measured ASR-judge CER 0.000 vs 0.094 on 3 digit-free sentences (2026-09-24). Side effect: the hi cleaner expands digits into HINDI number words - normalise Nepali numbers before TTS. Card-reported: Whisper round-trip CER 0.380, SCOREQ auto-MOS 4.21 (not verified here)."

