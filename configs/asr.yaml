  # --- Optional cloud baselines (OFF; need --allow-cloud and a personal/test GEMINI_API_KEY) ----
  - id: gemini-3.8-flash-asr
    name: Gemini 3.8 Flash (prompted transcription)
    provider: gemini-asr
    enabled: false
    external: true
    checkpoint: gemini-3.8-flash
    languages: [ne, en]
    params:
      service: Google Gemini API
      prompt: "Transcribe this audio verbatim. Write Nepali in Devanagari and keep English words in Latin script. Output only the transcript."
    license: {id: Google Gemini API Terms, url: https://ai.google.dev/gemini-api/terms, commercial_use: "conditional", notes: "Paid API. FREE TIER: Google may use submitted content to improve products and humans may review it - never send sensitive/personal data."}
    verified: "2026-09-23"
    sources: [https://ai.google.dev/gemini-api/docs/models, https://ai.google.dev/gemini-api/docs/audio]
    notes: "Stable model (2026-09-02). Inline audio limit 20 MB/request."

  - id: gemini-3.5-transcribe
    name: Gemini 3.5 Transcribe (dedicated STT)
    provider: gemini-asr
    enabled: false
    external: true
    checkpoint: gemini-3.5-transcribe
    languages: [ne-NP, "85+ locales"]
    params:
      service: Google Gemini API
      generation_config: {audioTranscriptionConfig: {languageCodes: [ne-NP]}}
    license: {id: Google Gemini API Terms, url: https://ai.google.dev/gemini-api/terms, commercial_use: "conditional", notes: "As gemini-3.8-flash-asr."}
    verified: "2026-09-23"
    sources: [https://ai.google.dev/gemini-api/docs/transcribe]
    notes: "Inline WAV audio verified working 2026-09-24 (docs only show Files API). Transcript is returned in parts[].audioTranscription.text, not parts[].text."
