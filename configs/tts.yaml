# TTS model registry. Voice licences are per checkpoint (Piper: each voice's MODEL_CARD), never the engine's.
# Checked and NOT present: facebook/mms-tts-npi does not exist (Nepali absent from MMS-TTS list);
# Chatterbox, IndicF5, Kokoro and base XTTS-v2 do not support Nepali officially (verified 2026-09-23);
# the community Oshara XTTS-v2 Nepali fine-tune is registered below.

models:
  - id: piper-ne-google-x-low
    name: Piper ne_NP-google-x_low
    provider: piper
    checkpoint: rhasspy/piper-voices
    revision: c10ece1aade47bb51c153c893d14e5bf8e5b7117
    languages: [ne]
    params: {file: ne/ne_NP/google/x_low/ne_NP-google-x_low.onnx}
    size: ~6.9M params (inferred), 27.7 MB, 16 kHz, 18 speakers (all female, OpenSLR-43)
    hardware: "CPU real-time (onnxruntime)"
    license:
      id: CC-BY-SA-4.0 (voice data); engine GPL-3.0-or-later
      url: https://huggingface.co/rhasspy/piper-voices/resolve/main/ne/ne_NP/google/x_low/MODEL_CARD
      commercial_use: REVIEW REQUIRED
      notes: "Trained from scratch on OpenSLR-43 (Google, CC BY-SA 4.0): attribution + ShareAlike (reach into weights unsettled). piper-tts engine is GPL-3.0 - distribution implications need legal review. Cleanest Piper option."
    verified: "2026-09-23"
    sources: [https://huggingface.co/rhasspy/piper-voices/tree/main/ne/ne_NP, https://www.openslr.org/43/, https://pypi.org/project/piper-tts/]

