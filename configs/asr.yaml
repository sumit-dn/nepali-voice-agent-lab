# ASR model registry. `enabled` = included in `voice-lab benchmark asr` by default.
# Facts copied from each checkpoint's OWN card/licence on `verified` (never inferred from a base model).
# commercial_use: yes | no | conditional | REVIEW REQUIRED
# provider: hf-asr | indicconformer | gemini-asr | none (= tracked candidate, no adapter yet)

models:
  # --- Candidate 1: AI4Bharat IndicConformer ---------------------------------------------------
  - id: indicconformer-600m
    name: AI4Bharat IndicConformer 600M multilingual (CTC decoding)
    provider: indicconformer
    checkpoint: ai4bharat/indic-conformer-600m-multilingual
    revision: e9b71b369c048e2c6b634d4c131061c34e441179   # pinned: trust_remote_code executes repo code
    languages: [ne, hi, mai, as, bn, brx, doi, gu, kn, kok, ks, ml, mni, mr, or, pa, sa, sat, sd, ta, te, ur]
    params: {language: ne, decoding: ctc}
    size: 600M params, ~2.56 GB (ONNX assets)
    hardware: "Not stated on card. ONNX Runtime; CPU should work (untested here), GPU via onnxruntime-gpu"
    license:
      id: MIT
      url: https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual
      commercial_use: "yes"
      notes: "Card: 'released under the MIT license'. Training data not stated on card. Gated (auto-approve): accept terms + HF_TOKEN."
    verified: "2026-09-23"
    sources: [https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual, https://github.com/AI4Bharat/IndicConformerASR]
    notes: "Card example uses 'hi'; Nepali code is 'ne'. Card pins onnxruntime-gpu==1.20.1 which does not exist on PyPI."

  - id: indicconformer-600m-rnnt
    name: AI4Bharat IndicConformer 600M multilingual (RNNT decoding)
    provider: indicconformer
    checkpoint: ai4bharat/indic-conformer-600m-multilingual
    revision: e9b71b369c048e2c6b634d4c131061c34e441179
    languages: [ne]
    params: {language: ne, decoding: rnnt}
    size: same weights as indicconformer-600m
    hardware: as indicconformer-600m
    license: {id: MIT, url: https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual, commercial_use: "yes", notes: "Same checkpoint as indicconformer-600m."}
    verified: "2026-09-23"
    sources: [https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual]

  - id: indicconformer-ne-nemo
    name: AI4Bharat IndicConformer Nepali (NeMo hybrid CTC/RNNT large)
    provider: none
    enabled: false
    checkpoint: ai4bharat/indicconformer_stt_ne_hybrid_ctc_rnnt_large
    revision: cd09ba7720f3b17d259f6bfd03e1463bc5ba517d
    languages: [ne]
    size: 120M params, ~523 MB .nemo
    hardware: "CPU or GPU"
    license: {id: MIT, url: https://huggingface.co/ai4bharat/indicconformer_stt_ne_hybrid_ctc_rnnt_large, commercial_use: "yes", notes: "MIT per card. Gated (auto). Training data not stated."}
    verified: "2026-09-23"
    sources: [https://huggingface.co/ai4bharat/indicconformer_stt_ne_hybrid_ctc_rnnt_large]
    notes: "Needs AI4Bharat NeMo fork (branch nemo-v2) - separate env. Community ONNX export OpenVoiceOS/ai4bharat-indicconformer-ne-onnx (MIT, int8 138 MB, not gated) is a CPU-friendly alternative worth an adapter."

