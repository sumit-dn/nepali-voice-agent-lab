    revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
    languages: [ne, en, "97 more"]
    params:
      generate_kwargs: {language: nepali, task: transcribe}
      long_form_kwargs: {return_timestamps: true}
    size: 809M params, ~1.62 GB
